name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: npm

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: latest
          extended: true

      - name: Build website
        run: hugo --minify --gc

      - name: Build search index
        run: npm run build:search

      - name: Upload website artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firebase-hosting
          path: |
            public
            firebase.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firebase-hosting
          path: .

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BODROVIS }}
          channelId: live
          projectId: bodrovis